name: CI Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Run Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Run schema validation tests
        run: |
          cd tests
          chmod +x schema-validation-tests.sh
          ./schema-validation-tests.sh

      - name: Validate JSON Schema syntax
        run: check-jsonschema --check-metaschema schema.json

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
          additional_files: build-portal.sh tests/schema-validation-tests.sh
